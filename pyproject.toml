[project]
name = "ai-agent-learning"
version = "0.1.0"
description = "AI Agent 学习笔记仓库，附命令行工具"
readme = "README.md"
authors = [
    { name = "kkz", email = "2158405971@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent = "ai_agent_learning.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = true
